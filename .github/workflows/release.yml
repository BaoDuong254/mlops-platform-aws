name: Approved Model Release
'on':
  workflow_dispatch:
    inputs:
      model_name:
        description: Explicit approved MLflow registered model
        required: true
        type: string
      model_version:
        description: Explicit approved numeric Registry version
        required: true
        type: string
      canary_test_cpu:
        description: 'Operational E2E test only: throttle candidate, stable unchanged; keep off normally'
        type: choice
        default: 'off'
        options:
        - 'off'
        - 100m
permissions:
  contents: write
  id-token: write
concurrency:
  group: eks-${{ vars.EKS_CLUSTER_NAME || 'mlops-aws-dev' }}-mutation
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-southeast-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'mlops-aws-dev' }}
      EXPECTED_REPOSITORY_ID: ${{ vars.EXPECTED_REPOSITORY_ID }}
      EXPECTED_OWNER_ID: ${{ vars.EXPECTED_OWNER_ID }}
      MODEL_NAME: ${{ inputs.model_name }}
      MODEL_VERSION: ${{ inputs.model_version }}
      INFERENCE_ECR_REPOSITORY: ${{ vars.INFERENCE_ECR_REPOSITORY }}
      CANARY_TEST_CPU: ${{ inputs.canary_test_cpu }}
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
        ref: main
        fetch-depth: 0
        persist-credentials: true
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@4959332f0f014c5280e7eac8b70c90cb574c9f9b
    - run: uv sync --locked
    - uses: azure/setup-kubectl@c0c8b32d33a5244f1e5947304550403b63930415
      with:
        version: v1.36.0
    - name: Validate trusted repository and inputs
      run: python3 scripts/workflow_guard.py release
    - name: Source regression checks
      run: make release-test
    - name: Assume dedicated release role with OIDC
      uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a
      with:
        role-to-assume: ${{ vars.AWS_ROLE_RELEASE }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Verify authenticated AWS account
      run: |
        actual_account="$(aws sts get-caller-identity --query Account --output text)"
        if [[ "$actual_account" != "$AWS_ACCOUNT_ID" ]]; then
          echo '::error::Authenticated AWS account differs from the configured project account'
          exit 1
        fi
    - name: Admit runner IPv4 only
      run: python3 scripts/m32_eks_cidr.py open --state-file "$RUNNER_TEMP/eks-cidrs.json"
    - name: Export, build, deploy, verify and promote one release
      run: bash scripts/m32_release.sh
    - name: Restore exact original EKS CIDRs
      if: ${{ always() }}
      run: python3 scripts/m32_eks_cidr.py close --state-file "$RUNNER_TEMP/eks-cidrs.json"
    - name: Preserve verification result
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-result-${{ github.run_id }}-${{ github.run_attempt }}
        path: 'artifacts/m32-result.json

          artifacts/m32-expected.json'
        if-no-files-found: ignore
        retention-days: 14
