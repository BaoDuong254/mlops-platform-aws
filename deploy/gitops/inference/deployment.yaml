apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
    mlops.aws/model-version: '4'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        mlops.aws/model-version: '4'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
        mlops.aws/release-id: m32-44997994758-1
        mlops.aws/artifact-checksum: 97f6993dbc813e88b7a53653ed6de7d3fc96ab8c87505720d02984dda8534df0
        mlops.aws/mlflow-run-id: 764d7cce511d42dd91dbd9f178d34949
        mlops.aws/serving-git-sha: 8798a620a191f07e8ac361f238c2fcf463b60ed4
    spec:
      terminationGracePeriodSeconds: 35
      nodeSelector:
        mlops.aws/workload: inference
        karpenter.sh/capacity-type: on-demand
      tolerations:
      - key: mlops.aws/workload
        operator: Equal
        value: inference
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: inference-api
        image: 160616607747.dkr.ecr.ap-southeast-1.amazonaws.com/mlops-aws-inference-dev@sha256:02fb7002a607c079c955afd7d81db15f1b84217d0b048abd67ddb16ab26ce703
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(5)
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
