apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
    mlops.aws/model-version: '3'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        mlops.aws/model-version: '3'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
        mlops.aws/release-id: m32-44220667678-1
        mlops.aws/artifact-checksum: 169e6981394d752cbdfe853e7fbd17878f942322380f7f29d00c7a6531a92b1f
        mlops.aws/mlflow-run-id: 363714d6a7634ebbb177026f93b6e7f1
        mlops.aws/serving-git-sha: d97360738986f7cd0ffaa2290a5c8f4ecbe95171
    spec:
      terminationGracePeriodSeconds: 35
      nodeSelector:
        mlops.aws/workload: inference
        karpenter.sh/capacity-type: on-demand
      tolerations:
      - key: mlops.aws/workload
        operator: Equal
        value: inference
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: inference-api
        image: 160616607747.dkr.ecr.ap-southeast-1.amazonaws.com/mlops-aws-inference-dev@sha256:5c0dd2ee04d6f1cf02a10051f881aa3d63b7bc0e7d24fecaddbb6874870f82ce
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(5)
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
