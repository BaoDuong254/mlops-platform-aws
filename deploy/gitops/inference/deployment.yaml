apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
    mlops.aws/model-version: '2'
spec:
  replicas: 1
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inference-api
  template:
    metadata:
      labels:
        app: inference-api
        mlops.aws/model-version: '2'
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/path: /metrics
        prometheus.io/port: '8000'
        mlops.aws/release-id: m32-43811965085-1
        mlops.aws/artifact-checksum: 789b014874ef62cebb5d0354739ae7fe79f622211558ad22a6689493fe34c33e
        mlops.aws/mlflow-run-id: e0c57ae47f7b42b5a4af17a43930ce01
        mlops.aws/serving-git-sha: c491b923f5f5744ea3018b0b3f14bc5c1e5d665e
    spec:
      terminationGracePeriodSeconds: 35
      nodeSelector:
        mlops.aws/workload: inference
        karpenter.sh/capacity-type: on-demand
      tolerations:
      - key: mlops.aws/workload
        operator: Equal
        value: inference
        effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: inference-api
        image: 160616607747.dkr.ecr.ap-southeast-1.amazonaws.com/mlops-aws-inference-dev@sha256:4e40fc49d895137e19b7fc7b587fa0e1470bb589db606f3afc7b84db09557821
        imagePullPolicy: IfNotPresent
        lifecycle:
          preStop:
            exec:
              command:
              - python
              - -c
              - import time; time.sleep(5)
        ports:
        - name: http
          containerPort: 8000
        startupProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 5
          failureThreshold: 24
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 10
          failureThreshold: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 20
          failureThreshold: 3
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
            ephemeral-storage: 512Mi
          limits:
            cpu: '1'
            memory: 1Gi
            ephemeral-storage: 2Gi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
