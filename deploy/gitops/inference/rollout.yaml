apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
  annotations:
    mlops.aws/model-name: nyc-taxi-trip-duration
    mlops.aws/model-version: '1'
    mlops.aws/release-id: m32-42011637577-1
    mlops.aws/artifact-checksum: d35626fd5e47c1e874be1cb4bb1d04278a33c07a34109cc6df2eccf6a0dcf6b3
    mlops.aws/serving-git-sha: a069afa3fbdba2dd174ee617a6fba48758ded005
    mlops.aws/mlflow-run-id: bb3155725d1149a8bfeefd1a9f184dbf
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
    scaleDown: onsuccess
  strategy:
    canary:
      stableService: inference-api
      canaryService: inference-api-canary
      trafficRouting:
        alb:
          ingress: inference-api
          servicePort: 8000
      analysis:
        startingStep: 3
        templates:
        - templateName: inference-canary-gate
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 0
      - analysis:
          templates:
          - templateName: inference-canary-smoke
          args:
          - name: model-name
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-name']
          - name: model-version
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-version']
          - name: release-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/release-id']
          - name: artifact-checksum
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/artifact-checksum']
          - name: serving-git-sha
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/serving-git-sha']
          - name: mlflow-run-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/mlflow-run-id']
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
