apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
  annotations:
    mlops.aws/model-name: nyc-taxi-trip-duration
    mlops.aws/model-version: '3'
    mlops.aws/release-id: m32-44256392109-1
    mlops.aws/artifact-checksum: 169e6981394d752cbdfe853e7fbd17878f942322380f7f29d00c7a6531a92b1f
    mlops.aws/serving-git-sha: 056c8c1b6b673c4c814a90db3a9c06a7b9d0ac8c
    mlops.aws/mlflow-run-id: 363714d6a7634ebbb177026f93b6e7f1
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
    scaleDown: onsuccess
  strategy:
    canary:
      stableService: inference-api
      canaryService: inference-api-canary
      trafficRouting:
        alb:
          ingress: inference-api
          servicePort: 8000
      analysis:
        startingStep: 3
        templates:
        - templateName: inference-canary-gate
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 0
      - analysis:
          templates:
          - templateName: inference-canary-smoke
          args:
          - name: model-name
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-name']
          - name: model-version
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-version']
          - name: release-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/release-id']
          - name: artifact-checksum
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/artifact-checksum']
          - name: serving-git-sha
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/serving-git-sha']
          - name: mlflow-run-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/mlflow-run-id']
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
