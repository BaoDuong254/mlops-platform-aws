apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
  annotations:
    mlops.aws/model-name: nyc-taxi-trip-duration
    mlops.aws/model-version: '4'
    mlops.aws/release-id: m32-44997994758-1
    mlops.aws/artifact-checksum: 97f6993dbc813e88b7a53653ed6de7d3fc96ab8c87505720d02984dda8534df0
    mlops.aws/serving-git-sha: 8798a620a191f07e8ac361f238c2fcf463b60ed4
    mlops.aws/mlflow-run-id: 764d7cce511d42dd91dbd9f178d34949
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
    scaleDown: onsuccess
  strategy:
    canary:
      stableService: inference-api
      canaryService: inference-api-canary
      trafficRouting:
        alb:
          ingress: inference-api
          servicePort: 8000
      analysis:
        startingStep: 3
        templates:
        - templateName: inference-canary-gate
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 0
      - analysis:
          templates:
          - templateName: inference-canary-smoke
          args:
          - name: model-name
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-name']
          - name: model-version
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-version']
          - name: release-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/release-id']
          - name: artifact-checksum
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/artifact-checksum']
          - name: serving-git-sha
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/serving-git-sha']
          - name: mlflow-run-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/mlflow-run-id']
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
