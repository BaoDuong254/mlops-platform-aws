apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: inference-api
  namespace: mlops
  labels:
    app: inference-api
  annotations:
    mlops.aws/model-name: nyc-taxi-trip-duration
    mlops.aws/model-version: '2'
    mlops.aws/release-id: m32-43810085589-1
    mlops.aws/artifact-checksum: 789b014874ef62cebb5d0354739ae7fe79f622211558ad22a6689493fe34c33e
    mlops.aws/serving-git-sha: c29470122e479d51927ea2308010b2cb62b47cd4
    mlops.aws/mlflow-run-id: e0c57ae47f7b42b5a4af17a43930ce01
spec:
  replicas: 1
  revisionHistoryLimit: 2
  progressDeadlineSeconds: 600
  workloadRef:
    apiVersion: apps/v1
    kind: Deployment
    name: inference-api
    scaleDown: onsuccess
  strategy:
    canary:
      stableService: inference-api
      canaryService: inference-api-canary
      trafficRouting:
        alb:
          ingress: inference-api
          servicePort: 8000
      analysis:
        startingStep: 3
        templates:
        - templateName: inference-canary-gate
        args:
        - name: canary-hash
          valueFrom:
            podTemplateHashValue: Latest
        - name: stable-hash
          valueFrom:
            podTemplateHashValue: Stable
      steps:
      - setCanaryScale:
          replicas: 1
      - setWeight: 0
      - analysis:
          templates:
          - templateName: inference-canary-smoke
          args:
          - name: model-name
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-name']
          - name: model-version
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/model-version']
          - name: release-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/release-id']
          - name: artifact-checksum
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/artifact-checksum']
          - name: serving-git-sha
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/serving-git-sha']
          - name: mlflow-run-id
            valueFrom:
              fieldRef:
                fieldPath: metadata.annotations['mlops.aws/mlflow-run-id']
      - setWeight: 10
      - pause:
          duration: 2m
      - setWeight: 50
      - pause:
          duration: 2m
